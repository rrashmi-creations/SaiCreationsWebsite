services:
  - type: web
    name: sai-creation-api
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: pip install --only-binary=libsql-experimental -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: TURSO_DATABASE_URL
        sync: false

      - key: TURSO_AUTH_TOKEN
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: SETUP_SECRET
        generateValue: true

      - key: FRONTEND_ORIGINS
        value: https://rrashmi-creations.github.io
